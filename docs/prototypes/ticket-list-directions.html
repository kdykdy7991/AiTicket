<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>工单列表 · 三种视觉方向</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#071323;color:#e9f4ff;font:14px/1.5 "Microsoft YaHei","PingFang SC",sans-serif}.intro{max-width:1480px;margin:auto;padding:30px 28px 10px}.intro h1{font-size:26px;margin:0 0 8px}.intro p{color:#9cb2cd;margin:0}.directions{display:grid;gap:36px;max-width:1480px;margin:24px auto 60px;padding:0 28px}.direction{border:1px solid #28506f;background:#0a1830;overflow:hidden}.caption{display:flex;align-items:baseline;gap:20px;padding:18px 22px;border-bottom:1px solid #244664}.caption b{font-size:19px}.caption span{color:#9fb6d0}.screen{display:grid;grid-template-columns:190px minmax(0,1fr);min-height:590px;background:var(--bg);color:var(--text)}.screen aside{background:var(--side);border-right:1px solid var(--line);padding:18px 10px}.brand{height:49px;padding:7px 14px;font-weight:800;font-size:18px;letter-spacing:.03em;border-bottom:1px solid var(--line);margin-bottom:20px}.brand small{display:block;font-size:9px;color:var(--muted);font-weight:500;letter-spacing:.17em}.nav{padding:11px 14px;margin:3px 0;color:var(--muted);border-radius:var(--radius)}.nav.active{color:var(--text);background:var(--active);border-left:3px solid var(--accent);font-weight:700}.nav-section{color:var(--muted);font-size:11px;letter-spacing:.12em;margin:26px 14px 9px}.main{min-width:0}.top{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--top)}.crumb{color:var(--muted);font-size:12px}.user{font-size:12px;color:var(--muted)}.body{padding:26px 27px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:21px}.heading h2{font-size:25px;margin:0;letter-spacing:.02em}.heading p{color:var(--muted);font-size:12px;margin:3px 0 0}.actions{display:flex;gap:9px}button{font:inherit;cursor:default}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:8px 15px;border-radius:var(--radius)}.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--button);font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:16px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 15px;position:relative;overflow:hidden}.metric label{display:block;color:var(--muted);font-size:12px}.metric strong{display:block;font-size:27px;margin:3px 0}.metric em{font-style:normal;color:var(--accent);font-size:11px}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:16px;white-space:nowrap;overflow:hidden}.tab{padding:10px 2px;color:var(--muted);font-size:12px}.tab.on{color:var(--accent);border-bottom:2px solid var(--accent);font-weight:700}.filter{display:flex;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:13px}.field{border:1px solid var(--line);background:var(--input);border-radius:var(--radius);height:34px;padding:7px 10px;color:var(--muted);font-size:12px;min-width:100px}.field.search{flex:1}.table{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}.table-title{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--line);font-weight:700}.table-title span{color:var(--muted);font-size:11px;font-weight:400}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;background:var(--thead);color:var(--muted);font-weight:500;padding:12px 11px;white-space:nowrap}td{padding:15px 11px;border-top:1px solid var(--line);white-space:nowrap}td:first-child,th:first-child{padding-left:17px}td:last-child{color:var(--accent)}.id{color:var(--accent);font-weight:700}.sub{display:block;color:var(--muted);font-size:11px}.badge{display:inline-block;padding:3px 8px;border-radius:4px;background:var(--badge);color:var(--accent)}.badge.warn{background:#44341b;color:#ffc76e}.badge.green{background:#103b3a;color:#63ddc1}.footer{display:flex;justify-content:space-between;padding:12px 16px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}
    .a{--bg:#08172b;--side:#112c51;--top:#0d2340;--panel:#11253e;--input:#0b1e35;--thead:#172e49;--line:#294766;--text:#edf6ff;--muted:#9cb3cd;--accent:#43b7ed;--active:#2b5990;--badge:#123c54;--button:#06192b;--radius:9px}.a .metric:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-22px;bottom:-38px;background:#117ba133}
    .b{--bg:#06101f;--side:#0a1a31;--top:#0b1830;--panel:#0b1d37;--input:#07182e;--thead:#0f2949;--line:#1b5a8d;--text:#f3faff;--muted:#8cb2d5;--accent:#38c5ff;--active:#133c68;--badge:#103f60;--button:#031320;--radius:2px}.b .brand,.b .heading h2{text-shadow:0 0 14px #39bdfd66}.b .metric,.b .table{box-shadow:inset 0 0 0 1px #0b3157,0 0 13px #0871bc25}.b .metric:before{content:"";position:absolute;width:42px;height:2px;background:var(--accent);top:0;left:0;box-shadow:0 0 9px var(--accent)}.b .heading h2:before{content:"/";color:var(--accent);margin-right:8px}.b .btn.primary{box-shadow:0 0 16px #188cca66}
    .c{--bg:#0a1728;--side:#0c1b2c;--top:#0e2034;--panel:#14283e;--input:#0d2034;--thead:#1a3047;--line:#2b455b;--text:#eef5fa;--muted:#a9bbca;--accent:#4ec7ce;--active:#1e4553;--badge:#1b4348;--button:#082326;--radius:5px}.c .metrics{display:none}.c .body{padding-top:31px}.c .heading{margin-bottom:32px}.c .heading h2{font-size:27px}.c .table-title{padding:16px}.c td{padding-top:19px;padding-bottom:19px}.c .filter{padding:17px}.c .tabs{gap:24px}
    @media(max-width:950px){.screen{grid-template-columns:125px 1fr}.brand{font-size:13px}.body{padding:15px}.metrics{grid-template-columns:repeat(2,1fr)}.filter{flex-wrap:wrap}.table{overflow:auto}.nav{padding:8px;font-size:11px}}
  </style>
</head>
<body>
  <div class="intro"><h1>工单列表 · 早期视觉方向</h1><p>已根据最新参考图更新为 <a href="ticket-list-target.html" style="color:#49c6ff;text-decoration:underline">工单列表目标视觉稿</a>。以下三个版本保留作方向对比；数据仅为排版示意。</p></div>
  <div class="directions" id="directions"></div>
  <script>
    const rows=[['TK-20261022-028','终端无法连接卫星网络','华东区 · 设备故障','待受理','高','客服一组','10-22 09:42'],['TK-20261022-027','客户反馈计费异常','华北区 · 账务咨询','处理中','中','技术支持组','10-22 09:18'],['TK-20261022-026','设备激活后状态未更新','华南区 · 设备故障','处理中','高','平台运维组','10-22 08:56'],['TK-20261021-025','服务开通进度咨询','华东区 · 服务咨询','已处理','低','客服一组','10-21 17:34']];
    const configs=[['a','方向 A · 运营控制台','贴近参考图1。深蓝侧栏、轻量数据卡与清楚的操作表格，适合日常使用。'],['b','方向 B · 指挥中心','吸收参考图2的发光线与仪表感，适合强调监控氛围。'],['c','方向 C · 精密工作台','保留深蓝和青色信号，但减少光效与指标装饰，强调长时间处理工单的效率。']];
    document.querySelector('#directions').innerHTML=configs.map(([key,name,desc])=>`<section class="direction"><div class="caption"><b>${name}</b><span>${desc}</span></div><div class="screen ${key}"><aside><div class="brand">SKDY TICKET<small>工单管理系统</small></div><div class="nav active">▣　工单</div><div class="nav">▤　来访记录</div><div class="nav">▥　工单统计</div><div class="nav">⌕　线索工单分析</div><div class="nav">▧　我的草稿</div><div class="nav">◈　知识库</div><div class="nav-section">管理</div><div class="nav">◉　用户管理</div><div class="nav">▦　组管理</div></aside><div class="main"><div class="top"><div class="crumb">工作台　/　工单管理　/　工单列表</div><div class="user">◉　客服账号　⌄</div></div><div class="body"><div class="heading"><div><h2>工单列表</h2><p>跟踪受理、处理与归档进度</p></div><div class="actions"><button class="btn">↓　导出</button><button class="btn primary">＋　新建工单</button></div></div><div class="metrics"><div class="metric"><label>工单总量</label><strong>128</strong><em>全部状态</em></div><div class="metric"><label>待受理</label><strong>12</strong><em>需要关注</em></div><div class="metric"><label>处理中</label><strong>34</strong><em>进行中</em></div><div class="metric"><label>已超时</label><strong>3</strong><em>优先处理</em></div></div><div class="tabs"><span class="tab on">全部</span><span class="tab">待受理</span><span class="tab">处理中</span><span class="tab">已处理</span><span class="tab">暂缓处理</span><span class="tab">已归档</span><span class="tab">已退回</span><span class="tab">已超时</span></div><div class="filter"><div class="field search">⌕　搜索工单号、客户或问题描述</div><div class="field">工单状态　⌄</div><div class="field">优先级　⌄</div><div class="field">时间范围　⌄</div><button class="btn">筛选</button></div><div class="table"><div class="table-title">工单记录 <span>共 128 条 · 最近更新于 10:24</span></div><table><thead><tr><th>工单号 / 问题</th><th>分类</th><th>状态</th><th>优先级</th><th>处理组</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><span class="id">${r[0]}</span><span class="sub">${r[1]}</span></td><td>${r[2]}</td><td><span class="badge ${r[3]==='已处理'?'green':r[3]==='待受理'?'warn':''}">${r[3]}</span></td><td>${r[4]}</td><td>${r[5]}</td><td>${r[6]}</td><td>查看 ›</td></tr>`).join('')}</tbody></table><div class="footer"><span>每页 20 条　共 128 条</span><span>‹　1　2　3　…　7　›</span></div></div></div></div></div></section>`).join('');
  </script>
</body>
