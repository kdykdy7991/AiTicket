<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>方向二｜双栏导引｜创建工单</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:#24272b;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei","PingFang SC",sans-serif;font-size:13px}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.shell{display:flex;min-height:100vh}.nav{width:188px;flex:none;background:#25282b;color:#c4c7ca;padding:0 9px}.brand{height:64px;padding:21px 17px;color:#fff;font-size:15px;font-weight:700;border-bottom:1px solid #42464a;margin-bottom:13px}.nav a{display:block;padding:12px 16px;border-radius:2px}.nav a.active{background:#3c4044;color:#fff;font-weight:600}.main{flex:1;min-width:0}.top{height:56px;border-bottom:1px solid #dedfdf;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 32px;color:#757b80}.top strong{color:#24272b;font-weight:500}.avatar{width:26px;height:26px;display:inline-grid;place-items:center;background:#e8e9e9;border-radius:50%;margin-right:8px}.page{max-width:1250px;margin:auto;padding:26px 32px 100px}.heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:21px}.heading h1{font-size:25px;margin:0;letter-spacing:-.02em}.heading p{margin:0;color:#858b90}.system{display:flex;gap:24px;flex-wrap:wrap;color:#858b90;font-size:12px}.system b{font-weight:500;color:#53595e;margin-left:5px}.group-head{display:flex;align-items:baseline;gap:11px}.group-head h2{font-size:15px;margin:0;font-weight:650}.index{font-size:11px;color:#8e9499;font-weight:700;font-variant-numeric:tabular-nums}.field{min-width:0;position:relative}.field-label{display:block;margin-bottom:7px;font-weight:600;color:#3d4246}.star{color:#a8463d;margin-left:3px}.f-satelliteNumber .star{display:none}.field input:not([type=radio]),.field select,.field textarea{width:100%;border:1px solid #cbd0d3;background:#fff;color:#24272b;border-radius:2px;outline:0;padding:0 11px;height:36px}.field textarea{height:auto;padding:11px;resize:vertical;line-height:1.65}.field input:focus,.field select:focus,.field textarea:focus{border-color:#4b5156;box-shadow:0 0 0 1px #4b5156}.field input::placeholder,.field textarea::placeholder{color:#a0a5a9}.field small{display:block;margin-top:5px;color:#93999d;font-size:11px}.field .count{text-align:right}.radios{height:36px;display:flex;align-items:center;gap:20px}.radios label{font-weight:400;white-space:nowrap}.radios input{accent-color:#303438;vertical-align:middle}.actions button{height:36px;min-width:90px;padding:0 15px;border:1px solid #c9ced1;background:#fff;color:#33383c;border-radius:2px}.actions .submit{background:#292d30;border-color:#292d30;color:#fff}.actions .cancel{border:0;background:transparent;color:#6b7176}.actions button:hover{filter:brightness(.94)}.toast{position:fixed;top:72px;right:24px;background:#292d30;color:white;padding:10px 16px;z-index:10;display:none}@media(max-width:1000px){.nav{width:58px}.brand{font-size:0}.nav a{font-size:0;height:42px}.page{padding:24px 20px 100px}}@media(max-width:700px){.system{gap:10px 18px}.top{padding:0 18px}.heading{display:block}.heading p{margin-top:8px}}.page{max-width:1280px}.composition{display:grid;grid-template-columns:1fr 300px;gap:30px}.left{min-width:0}.right{border-left:1px solid #dadddf;padding-left:24px}.system{display:block;margin-top:12px}.system span{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #e5e7e8}.system b{margin:0}.group{padding:19px 0;border-top:1px solid #d4d8da}.group-head{margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}.f-description{grid-column:1/-1}.f-description textarea{height:170px}.fault{background:#f0f1f1;padding:20px;margin-top:10px;border-top:2px solid #555b60}.actions{border-top:1px solid #cfd3d5;margin-top:20px;padding-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .submit{grid-column:1/-1;grid-row:1;height:42px}.actions .cancel{grid-column:1}.actions .draft{grid-column:2}@media(max-width:1050px){.composition{grid-template-columns:1fr}.right{border-left:0;border-top:1px solid #dadddf;padding:15px 0}.system{display:flex}.actions{display:flex;justify-content:flex-end}}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><!-- 设计假设：字段、选项、联动依照现有 TicketCreateDesignView；人名和班组为视觉占位；操作仅本地演示。 --><div class="shell"><aside class="nav"><div class="brand">客服工单系统</div><a href="#">首页</a><a class="active" href="#">工单管理</a><a href="#">工单查询</a><a href="#">客户管理</a><a href="#">统计分析</a><a href="#">知识库</a><a href="#">系统设置</a></aside><div class="main"><div class="top"><span>工单管理 / <strong>创建工单</strong></span><span><span class="avatar">张</span>张三（客服）</span></div><main class="page"><div class="heading"><h1>创建工单</h1><p>分区导引 · 主次明确</p></div><form><div class="composition"><div class="left"><section class="group " ><header class="group-head"><span class="index">01</span><h2>受理信息</h2></header><div class="grid"><div class="field f-channel"><label class="field-label" for="channel">受理渠道<span class="star">*</span></label><select id="channel" name="channel" required><option value="">请选择受理渠道</option><option value="语音">语音</option><option value="在线客服">在线客服</option><option value="内部转办">内部转办</option></select></div></div></section><section class="group " ><header class="group-head"><span class="index">02</span><h2>客户信息</h2></header><div class="grid"><div class="field f-customerName"><label class="field-label" for="customerName">客户名称<span class="star">*</span></label><input id="customerName" name="customerName" type="text" placeholder="请输入客户名称" required></div><div class="field f-companyName"><label class="field-label" for="companyName">单位全称<span class="star">*</span></label><input id="companyName" name="companyName" type="text" placeholder="请输入单位全称" required></div><div class="field f-industry"><label class="field-label" for="industry">行业<span class="star">*</span></label><select id="industry" name="industry" required><option value="">请选择行业</option><option value="物联网">物联网</option><option value="海洋渔业">海洋渔业</option><option value="水利">水利</option><option value="能源">能源</option><option value="未提供">未提供</option></select></div><div class="field f-callerPhone"><label class="field-label" for="callerPhone">来电号码<span class="star">*</span></label><input id="callerPhone" name="callerPhone" type="tel" placeholder="请输入来电号码" required></div><div class="field f-contactPhone"><label class="field-label" for="contactPhone">联系号码</label><input id="contactPhone" name="contactPhone" type="tel" placeholder="请输入联系号码"><small>可在联系方式不同时补充</small></div><div class="field f-email"><label class="field-label" for="email">邮箱</label><input id="email" name="email" type="email" placeholder="请输入邮箱"></div></div></section><section class="group " ><header class="group-head"><span class="index">03</span><h2>工单内容</h2></header><div class="grid"><div class="field f-category"><label class="field-label" for="category">一级分类<span class="star">*</span></label><select id="category" name="category" required><option value="">请选择一级分类</option><option value="咨询">咨询</option><option value="投诉">投诉</option><option value="业务运营">业务运营</option><option value="业务保障">业务保障</option></select></div><div class="field f-subcategory"><label class="field-label" for="subcategory">二级分类<span class="star">*</span></label><select id="subcategory" name="subcategory" required><option value="">请选择二级分类</option></select></div><div class="field f-satelliteNumber"><label class="field-label" for="satelliteNumber">卫星物联码号<span class="star">*</span></label><input id="satelliteNumber" name="satelliteNumber" type="text" placeholder="请输入卫星物联码号"><small>仅业务运营、业务保障必填</small></div><div class="field f-businessOpportunity"><label class="field-label" for="businessOpportunity">是否为线索工单<span class="star">*</span></label><div class="radios"><label><input type="radio" name="businessOpportunity" value="yes"> 是</label><label><input type="radio" name="businessOpportunity" value="no"> 否</label></div></div><div class="field f-expectedResult"><label class="field-label" for="expectedResult">客户期望结果<span class="star">*</span></label><select id="expectedResult" name="expectedResult" required><option value="">请选择客户期望结果</option><option value="解释说明">解释说明</option><option value="远程排查">远程排查</option><option value="上门检修">上门检修</option><option value="换终端">换终端</option><option value="退费">退费</option><option value="销户">销户</option><option value="体验优化">体验优化</option></select></div><div class="field f-priority"><label class="field-label" for="priority">优先级<span class="star">*</span></label><select id="priority" name="priority" required><option value="">请选择优先级</option><option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option><option value="P4">P4</option></select></div><div class="field f-description"><label class="field-label" for="description">客户问题详情<span class="star">*</span></label><textarea id="description" name="description" maxlength="1000" rows="6" placeholder="请尽量记录客户原始描述" required></textarea><small class="count"><span id="count">0</span>/1000</small></div></div></section><section class="group fault" hidden><header class="group-head"><span class="index">04</span><h2>故障信息</h2></header><div class="grid"><div class="field f-faultTime"><label class="field-label" for="faultTime">故障发生时间<span class="star">*</span></label><input id="faultTime" name="faultTime" type="datetime-local" placeholder="请输入故障发生时间" required></div><div class="field f-recurrence"><label class="field-label" for="recurrence">故障复现规律<span class="star">*</span></label><select id="recurrence" name="recurrence" required><option value="">请选择故障复现规律</option><option value="必现">必现</option><option value="偶发">偶发</option><option value="仅特定时段">仅特定时段</option></select></div><div class="field f-faultLocation"><label class="field-label" for="faultLocation">故障发生地理位置<span class="star">*</span></label><input id="faultLocation" name="faultLocation" type="text" placeholder="请输入故障发生地理位置" required></div><div class="field f-batchFault"><label class="field-label" for="batchFault">是否批量故障<span class="star">*</span></label><div class="radios"><label><input type="radio" name="batchFault" value="yes"> 是</label><label><input type="radio" name="batchFault" value="no"> 否</label></div></div></div></section></div><aside class="right"><div class="group-head"><span class="index">SYS</span><h2>系统信息</h2></div><div class="system"><span>工单号 <b>保存后自动生成</b></span><span>受理工号 <b>10086</b></span><span>受理人 <b>张三</b></span><span>受理班组 <b>客服一组</b></span><span>受理时间 <b id="time"></b></span></div><div class="actions"><button type="button" class="cancel" id="cancel">取消</button><button type="button" class="draft" id="draft">保存草稿</button><button type="submit" class="submit">提交工单</button></div></aside></div></form></main></div></div><div class="toast" role="status"></div><script>const categories={"咨询":["品牌合作","产品使用/参数咨询","渠道/代理合作"],"投诉":["一般投诉","重要投诉","重大投诉"],"业务运营":["套餐变更","业财对账"],"业务保障":["终端故障","平台故障","网络故障"]};
const form=document.querySelector('form'),category=form.elements.category,sub=form.elements.subcategory,fault=document.querySelector('.fault'),sat=form.elements.satelliteNumber;
document.getElementById('time').textContent=new Date().toLocaleString('zh-CN',{hour12:false});
function sync(){const old=sub.value;sub.innerHTML='<option value="">请选择二级分类</option>'+(categories[category.value]||[]).map(v=>`<option value="${v}">${v}</option>`).join('');sub.value=(categories[category.value]||[]).includes(old)?old:'';sub.disabled=!category.value;fault.hidden=category.value!=='业务保障';sat.required=['业务运营','业务保障'].includes(category.value);document.querySelector('.f-satelliteNumber .star').style.display=sat.required?'inline':'none';fault.querySelectorAll('input,select').forEach(el=>el.disabled=fault.hidden);}
category.addEventListener('change',()=>{sub.value='';sync()});sync();
form.elements.description.addEventListener('input',e=>document.getElementById('count').textContent=e.target.value.length);
function toast(message){const t=document.querySelector('.toast');t.textContent=message;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
document.getElementById('draft').onclick=()=>{localStorage.setItem('ticket_create_ui_draft',JSON.stringify(Object.fromEntries(new FormData(form))));toast('草稿已保存在本机（设计演示）')};
document.getElementById('cancel').onclick=()=>toast('设计演示：取消');
form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;for(const key of ['businessOpportunity',...(fault.hidden?[]:['batchFault'])]){if(!form.querySelector(`[name=${key}]:checked`)){toast('请填写所有必填项');return}}toast('校验通过（设计演示）')});</script></body></html>
