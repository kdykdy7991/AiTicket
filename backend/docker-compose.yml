name: skdy-ticket-dev

services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    ports:
      - "127.0.0.1:5545:5432"
    environment:
      POSTGRES_USER: skdy
      POSTGRES_PASSWORD: skdy123
      POSTGRES_DB: skdy_ticket
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skdy -d skdy_ticket"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    # Resolve the shared configuration relative to this Compose file, regardless
    # of the directory or command used to start the development stack.
    env_file:
      - ../.env
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://skdy:skdy123@db:5432/skdy_ticket
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-}
      CASDOOR_ISSUER: ${CASDOOR_ISSUER:-}
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID:-}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:-}
      CASDOOR_REDIRECT_ORIGINS: ${CASDOOR_REDIRECT_ORIGINS:-}
      RAG_API_URL: ${RAG_API_URL:-http://10.113.114.88:8770}
      RAG_SERVICE_TOKEN: ${RAG_SERVICE_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app  # dev: hot reload
      - ./alembic:/app/alembic  # dev: migration scripts follow the checkout
      - uploads:/app/uploads

  mcp:
    build:
      context: ../mcp_server
    ports:
      - "10.113.114.88:8002:8000"
      - "127.0.0.1:8002:8000"
    environment:
      TICKET_API_URL: http://api:8000
      MCP_INTERNAL_TOKEN: ${MCP_INTERNAL_TOKEN:-}
      MCP_BEARER_TOKEN: ${MCP_BEARER_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    depends_on:
      - api

  # Development bridge to Debussy's loopback-only Vite proxy.
  agent-bridge:
    build: .
    network_mode: host
    command: python scripts/debussy_dev_bridge.py
    environment:
      DEBUSSY_DEV_PROXY_TARGET: http://127.0.0.1:5176
      DEBUSSY_DEV_BRIDGE_BIND: 10.113.114.88
      DEBUSSY_DEV_BRIDGE_PORT: 8767

volumes:
  pgdata:
  uploads:
